name: CI

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: go_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://postgres:root@localhost:5432/go_auth?sslmode=disable"
      REDIS_ADDR: "localhost:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: "ci-pipeline-secure-jwt-secret-key-32-chars-min"
      IS_LOCAL_DEV_WITHOUT_SMTP: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Apply Database Migrations
        run: go run database/cmd/main.go -migrate up

      - name: Run Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run Go Vulnerability Check
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
