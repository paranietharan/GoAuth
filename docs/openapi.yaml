openapi: 3.0.3
info:
  title: GoAuth — Production-Grade Monolithic Authentication API
  description: >
    Production-ready authentication foundation for Go monolithic web APIs.
    Features refresh-token rotation with reuse detection, session family tracking,
    RBAC, rate-limiting, email verification, and security audit logging.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  /health:
    get:
      summary: Liveness health probe
      description: Returns 200 OK if the HTTP server is alive and responding.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time

  /ready:
    get:
      summary: Readiness probe
      description: Checks database and redis connectivity. Returns 503 if any dependency is down.
      responses:
        '200':
          description: All dependencies ready
        '503':
          description: One or more dependencies are unhealthy

  /api/v1/auth/signup:
    post:
      summary: User registration
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Signup successful, email verification sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: User already exists

  /api/v1/auth/register:
    post:
      summary: User registration (alias)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: Signup successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/v1/auth/verify-email:
    post:
      summary: Verify email address using OTP
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired OTP

  /api/v1/auth/login:
    post:
      summary: Authenticate with email and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Invalid credentials
        '403':
          description: Email not verified or account disabled
        '429':
          description: Rate limit exceeded

  /api/v1/auth/refresh:
    post:
      summary: Rotate and refresh session tokens
      description: >
        Issues a new short-lived access token and a new rotated refresh token.
        If an already-rotated or revoked refresh token is presented, reuse detection
        immediately revokes the entire session family.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
      responses:
        '200':
          description: Tokens refreshed and session rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Invalid, expired, or reused refresh token

  /api/v1/auth/refresh-session:
    post:
      summary: Rotate and refresh session tokens (alias)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'

  /api/v1/auth/logout:
    post:
      summary: Logout current session
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/v1/auth/logout-all:
    post:
      summary: Logout all active sessions for current user
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/v1/auth/change-password:
    post:
      summary: Change password for authenticated user
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Current password incorrect or validation failed

  /api/v1/auth/sessions:
    get:
      summary: List all active sessions for user
      tags: [Session Management]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'

  /api/v1/auth/sessions/{id}:
    delete:
      summary: Revoke session by ID
      tags: [Session Management]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset OTP
      tags: [Password Recovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/v1/auth/forgot-password/verify-otp:
    post:
      summary: Verify reset OTP and obtain temporary reset token
      tags: [Password Recovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordOTPVerifyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset_token:
                    type: string

  /api/v1/auth/password-reset:
    post:
      summary: Reset password using temporary reset token
      tags: [Password Recovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/v1/users/me:
    get:
      summary: Get current authenticated user profile
      tags: [User Management]
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /api/v1/admin/users:
    get:
      summary: List users with pagination (Admin only)
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '403':
          description: Forbidden (Admin role required)

  /api/v1/admin/users/{id}/status:
    patch:
      summary: Enable or disable a user account (Admin only)
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Forbidden (Admin role required)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Request payload failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
              example: validation failed

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: StrongP@ss123!

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    VerifyEmailRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          example: "123456"

    RefreshSessionRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ForgotPasswordOTPVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string

    PasswordResetRequest:
      type: object
      required: [reset_token, new_password]
      properties:
        reset_token:
          type: string
        new_password:
          type: string

    UpdateUserStatusRequest:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean

    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, ADMIN]
        is_active:
          type: boolean
        is_email_verified:
          type: boolean

    AuthTokensResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/UserProfileResponse'

    SessionItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ip_address:
          type: string
        device:
          type: string
        user_agent:
          type: string
        is_current:
          type: boolean
        created_at:
          type: string
          format: date-time
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time

    SessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionItemResponse'

    UsersListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileResponse'
